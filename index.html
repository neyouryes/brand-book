<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>T.C.H | Brand Book</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <a class="brandMark" href="#s=0" id="homeBtn" aria-label="T.C.H home">
        <span class="tch">T.C.H</span>
        <span class="dots" aria-hidden="true">
          <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
        </span>
      </a>

      <div class="brandText">
        <div class="name">BRAND BOOK</div>
        <div class="tag">100×150 · 4 panels · spread preview</div>
      </div>
    </div>

    <div class="nav">
      <button class="navBtn" id="prevBtn" type="button" aria-label="Previous spread">←</button>
      <div class="navMeta">
        <div class="counter"><span id="pageNow">1</span> / <span id="pageAll">2</span></div>
        <div class="hint">Desktop: 좌우 스프레드 · Mobile: 스크롤 미리보기</div>
      </div>
      <button class="navBtn" id="nextBtn" type="button" aria-label="Next spread">→</button>
    </div>
  </header>

  <main class="main">
    <!-- Spread Preview -->
    <section class="stage">
      <div class="spread" id="spread">
        <!-- JS inject panels -->
      </div>

      <!-- Mobile: all panels (stack) -->
      <section class="stack" id="stack" aria-label="All panels preview">
        <!-- JS inject panels -->
      </section>
    </section>

    <footer class="foot">© To. coffee haus</footer>
  </main>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
