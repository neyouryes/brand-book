<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>T.C.H | Brand Book Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <a class="brandMark" href="#" id="homeBtn" aria-label="T.C.H home">
        <span class="tch">T.C.H</span>
        <span class="dots" aria-hidden="true">
          <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
        </span>
      </a>

      <div class="brandText">
        <div class="name">BRAND BOOK</div>
        <div class="tag">100×150 · 4 panels · spread preview</div>
      </div>
    </div>

    <div class="tools">
      <div class="navRow">
        <button class="navBtn" id="prevBtn" type="button" aria-label="Previous spread">←</button>
        <div class="pageMeta">
          <span id="pageTxt">1/2</span>
          <span class="dotSep">·</span>
          <span class="muted">© To. coffee haus</span>
        </div>
        <button class="navBtn" id="nextBtn" type="button" aria-label="Next spread">→</button>
      </div>

      <div class="hintRow">
        <span class="hint">Tip: 모바일은 세로로 “두 장(스프레드)” 미리보기 · PC는 실제 100×150 비율로 보기 좋아</span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="stageWrap">
      <div class="stage" id="stage" aria-label="Brand book spread preview">
        <!-- JS renders spread -->
      </div>
    </section>

    <footer class="foot">© To. coffee haus</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
