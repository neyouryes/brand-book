<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To. coffee haus | Brand Book</title>
  <link rel="stylesheet" href="book.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <a class="brandMark" href="#" id="homeBtn" aria-label="To. coffee haus home">
        <span class="tch">T.C.H</span>
        <span class="dots" aria-hidden="true">
          <i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>
        </span>
      </a>
      <div class="brandText">
        <div class="name">TO. COFFEE HAUS</div>
        <div class="tag">brand book · partners</div>
      </div>
    </div>

    <div class="tools">
      <div class="navRow">
        <button class="btn" id="prevBtn" type="button">← Prev</button>
        <div class="meta"><span id="spreadName">Spread 01</span> · <span id="pageHint">01–02</span></div>
        <button class="btn" id="nextBtn" type="button">Next →</button>
      </div>

      <div class="seg">
        <button class="segBtn isOn" data-spread="0" type="button">01–02</button>
        <button class="segBtn" data-spread="1" type="button">03–04</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="stage">
      <!-- spread container -->
      <div class="spreadWrap">
        <div class="spread" id="spread">
          <!-- LEFT PAGE -->
          <article class="page" id="pageL" aria-label="Left page"></article>

          <!-- RIGHT PAGE -->
          <article class="page" id="pageR" aria-label="Right page"></article>
        </div>
      </div>

      <footer class="foot">© To. coffee haus</footer>
    </section>
  </main>

  <script src="book.js"></script>
</body>
</html>
